[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-opsecscan"
version = "0.1.1"
description = "Scan documents and file metadata for OPSEC leaks: geotags, author, GPS EXIF, unit identifiers."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "defense", "opsecscan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/opsecscan"

[project.scripts]
"opsecscan-emit" = "opsecscan.connect:emit_main"
opsecscan = "opsecscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["opsecscan"]
